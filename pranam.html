<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="pranam"></title>
    <link
      rel="stylesheet"
      href="./fontawesome/css/all.min.css"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <a href="topic-4.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <div class="language-container">
      <div class="english active">E</div>
      <div class="hindi">H</div>
      <div class="gujrati">G</div>
    </div>
    <div class="pranam-container">
      
      <div class="pranam-img">
        <div class="pranam-video">
          <video src="./assets/videos/pranam.mp4" autoplay muted></video>
        </div>
        <span data-lang-key="pranam"></span>
        <img src="./assets/images/pranam-img.png" alt="" />
      </div>
      <a href="index.html" class="home-btn-1">
        <span data-lang-key="home"></span>
        <img src="./assets/images/home-btn-1.png" alt="" />
      </a>
    </div>
    <script src="./assets/js/app.js"></script>
      <script src="./assets/js/djp.js"></script>
    <script>
      const backBtn = document.querySelector(".back-btn");
      const homeBtn1 = document.querySelector(".home-btn-1");

      const pranamAudio = new Audio("./assets/audio/pranam.mp3");
      const popAudio = new Audio("./assets/audio/pop.mp3");
      const homeAudio = new Audio("./assets/audio/8.mp3");

      // play pranam.mp3 only once, on page load
      window.addEventListener("DOMContentLoaded", () => {
        pranamAudio.play().catch(() => {});
      });

      // play pop.mp3 on back-btn click, then navigate
      backBtn?.addEventListener("click", function (e) {
        e.preventDefault();
        const targetUrl = this.getAttribute("href");

        popAudio.currentTime = 0;
        popAudio.play().catch(() => {});

        setTimeout(() => {
          window.location.href = targetUrl;
        }, 300);
      });

      // play 8.mp3 on home-btn-1 click, then navigate
      homeBtn1?.addEventListener("click", function (e) {
        e.preventDefault();
        const targetUrl = this.getAttribute("href");

        homeAudio.currentTime = 0;
        homeAudio.play().catch(() => {});

        setTimeout(() => {
          window.location.href = targetUrl;
        }, 300);
      });
    </script>
  </body>
</html>
