<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="title"></title>

    <link
      rel="stylesheet"
      href="./assets/css/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />

    <link
      rel="stylesheet"
      href="./fontawesome/css/all.min.css"
    />

    <style>
      .pranam-link {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
    right: 2vw;
    bottom: 2vw;
    width: 9vw;
    height: auto;
    text-decoration: none;
    z-index: 9999;
    cursor: pointer;
    transform-origin: center;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }

  .pranam-link.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    animation: pranamPop 1.2s ease-in-out infinite;
  }
    
.pranam-link img {
  position: relative;
  width: 100%;
  display: block;
  object-fit: contain;
}

.pranam-link span {
  position: absolute;
  text-decoration: none;
  color: white;
  font-weight: bold;
  font-size: 1.3vw;
  padding-right: 1vw;
    font-family: "BalooRegular";

}

@keyframes pranamPop {
  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.12);
  }

  100% {
    transform: scale(1);
  }
}

      /* ---------- Video popup styles ---------- */
      body.video-open main,
      body.video-open .page-title,
      body.video-open .home-button,
      body.video-open .language-container,
      body.video-open .pranam-link,
      body.video-open .video-btn {
        filter: blur(0.45vw);
        pointer-events: none;
        user-select: none;
      }

      main,
      .page-title,
      .home-button,
      .language-container,
      .video-btn {
        transition: filter 0.4s ease;
      }

      .video-btn {
        position: fixed;
        bottom: 0.3vw;
        left: 4vw;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.4s ease,
          visibility 0.4s ease,
          filter 0.4s ease;
      }

      .video-btn.show {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .start-video-btn {
        width: 14vw;
        height: 6vw;
        border-radius: 50vw;
        background: transparent;

        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        gap: 0.8vw;
        padding: 0 1vw;
        border: none;
        background-image: url("./assets/images/watch.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        transition:
          transform 0.25s ease,
          background 0.25s ease,
          box-shadow 0.25s ease;
      }

      .start-video-btn:hover {
        transform: scale(1.04);
      }

      .start-video-btn:active {
        transform: scale(0.98);
      }

      .close-video-btn i,
      .video-center-play i,
      .control-btn i {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        flex: 0 0 auto;
      }

      .close-video-btn i {
        width: 1.8vw;
        min-width: 1.8vw;
        max-width: 1.8vw;
      }

      .video-center-play i {
        width: 2.2vw;
        min-width: 2.2vw;
        max-width: 2.2vw;
      }

      .control-btn i {
        width: 1.4vw;
        min-width: 1.4vw;
        max-width: 1.4vw;
      }

      .start-text {
        width: 100%;
        float: right;
        font-size: 1.3vw;
        font-weight: 900;
        letter-spacing: 0.1vw;
        color: #ffffff;
        line-height: 1;
        margin-left: 3.2vw;
        white-space: nowrap;
        font-family: "BalooRegular";
      }

      body[data-lang="hi"] .start-text {
        font-weight: lighter !important;
        font-size: 1.5vw;
      }

      .video-popup {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.38);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
      }

      .video-popup.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .video-box {
        position: relative;
        width: 68vw;
        aspect-ratio: 16 / 9;
        border-radius: 2vw;
        background: #ffdba1;
        padding: 0.75vw;
        border: 0.25vw solid white;
        box-shadow: 0 1vw 3vw rgba(0, 0, 0, 0.45);
        transform: scale(0.82);
        opacity: 0;
        transition:
          transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.35s ease;
      }

      .video-popup.active .video-box {
        transform: scale(1);
        opacity: 1;
      }

      .popup-video-frame {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 1.4vw;
        overflow: hidden;
        background: #000;
        border: 0.18vw solid #7b963d;
      }

      .popup-video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        background: #000;
      }

      .close-video-btn {
        position: absolute;
        top: -1.35vw;
        right: -1.35vw;
        width: 3.4vw;
        height: 3.4vw;
        border: none;
        border-radius: 50%;
        background: #ffffff;
        color: #7b963d;
        font-size: 1.8vw;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
        box-shadow: 0 0.35vw 1vw rgba(0, 0, 0, 0.35);
        transition:
          transform 0.25s ease,
          background 0.25s ease,
          color 0.25s ease;
      }

      .close-video-btn:hover {
        transform: rotate(90deg) scale(1.08);
        background: #8da23a;
        color: #ffffff;
      }

      .custom-controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        padding: 1vw;
        display: flex;
        flex-direction: column;
        gap: 0.75vw;
        background: linear-gradient(
          to top,
          rgba(86, 107, 38, 0.95),
          rgba(123, 150, 61, 0.58),
          rgba(123, 150, 61, 0)
        );
        opacity: 1;
        transition: opacity 0.25s ease;
      }

      .popup-video-frame.controls-hidden .custom-controls {
        opacity: 0;
        pointer-events: none;
      }

      .progress-wrap {
        width: 100%;
        display: flex;
        align-items: center;
      }

      .video-progress {
        width: 100%;
        appearance: none;
        -webkit-appearance: none;
        height: 0.45vw;
        border-radius: 5vw;
        background: rgba(255, 255, 255, 0.35);
        cursor: pointer;
        overflow: hidden;
        pointer-events: auto;
      }

      .video-progress::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 1vw;
        height: 1vw;
        border-radius: 50%;
        background: #ffdba1;
        box-shadow: -70vw 0 0 69.6vw #ffdba1;
        cursor: pointer;
      }

      .video-progress::-moz-range-thumb {
        width: 1vw;
        height: 1vw;
        border: none;
        border-radius: 50%;
        background: #ffdba1;
        cursor: pointer;
      }

      .video-progress::-moz-range-progress {
        height: 0.45vw;
        border-radius: 5vw;
        background: #ffdba1;
      }

      .control-row {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1vw;
      }

      .control-left,
      .control-right {
        display: flex;
        align-items: center;
        gap: 0.8vw;
      }

      .control-btn {
        width: 2.8vw;
        min-width: 2.8vw;
        max-width: 2.8vw;
        height: 2.8vw;
        border: none;
        border-radius: 50%;
        background: rgba(255, 219, 161, 0.28);
        color: #ffffff;
        font-size: 1.2vw;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          background 0.25s ease,
          color 0.25s ease,
          transform 0.25s ease;
      }

      .control-btn:hover {
        background: #ffdba1;
        color: #566b26;
        transform: scale(1.08);
      }

      .time-text {
        color: #ffffff;
        font-size: 1.05vw;
        font-weight: 700;
        font-family: Arial, sans-serif;
        letter-spacing: 0.05vw;
        min-width: 8vw;
      }

      .volume-range {
        width: 7vw;
        appearance: none;
        -webkit-appearance: none;
        height: 0.4vw;
        border-radius: 5vw;
        background: rgba(255, 255, 255, 0.35);
        cursor: pointer;
      }

      .volume-range::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 0.9vw;
        height: 0.9vw;
        border-radius: 50%;
        background: #ffdba1;
        cursor: pointer;
      }

      .volume-range::-moz-range-thumb {
        width: 0.9vw;
        height: 0.9vw;
        border: none;
        border-radius: 50%;
        background: #ffdba1;
        cursor: pointer;
      }

      .video-center-play {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 6vw;
        min-width: 6vw;
        max-width: 6vw;
        height: 6vw;
        border: 0.22vw solid rgba(255, 255, 255, 0.85);
        border-radius: 50%;
        background: rgba(86, 107, 38, 0.42);
        color: #ffdba1;
        font-size: 2.2vw;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transform: translate(-50%, -50%) scale(1);
        z-index: 4;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease,
          background 0.25s ease;
      }

      .video-center-play.hide {
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0.8);
      }

      .video-center-play:hover {
        background: rgba(86, 107, 38, 0.68);
        transform: translate(-50%, -50%) scale(1.08);
      }

      .video-box:fullscreen {
        width: 100%;
        height: 100%;
        border-radius: 0;
        padding: 0;
        background: #000;
      }

      .video-box:fullscreen .popup-video-frame {
        border-radius: 0;
        border: none;
      }

      .video-box:fullscreen .close-video-btn {
        top: 1.5vw;
        right: 1.5vw;
      }
    </style>
  </head>

  <body>

    <script src="./assets/js/swiper-bundle.min.js"></script>
    <script src="./assets/js/app.js"></script>
      <script src="./assets/js/djp.js"></script>
    <script>
      // ---- Audio SFX setup ----
      const popAudio = new Audio("./assets/audio/pop.mp3");
      const swipeAudio = new Audio("./assets/audio/swipe.mp3");
      const topicAudio = new Audio("./assets/audio/topic.mp3");
      const transitionAudio = new Audio("./assets/audio/transition.mp3");
      popAudio.preload = "auto";
      swipeAudio.preload = "auto";
      topicAudio.preload = "auto";
      transitionAudio.preload = "auto";

      function playPopSound() {
        try {
          popAudio.currentTime = 0;
          popAudio.play().catch(function () {});
        } catch (e) {}
      }

      function playSwipeSound() {
        try {
          swipeAudio.currentTime = 0;
          swipeAudio.play().catch(function () {});
        } catch (e) {}
      }

      function playTopicSound() {
        try {
          topicAudio.currentTime = 0;
          topicAudio.play().catch(function () {});
        } catch (e) {}
      }

      function playTransitionSound() {
        try {
          transitionAudio.currentTime = 0;
          transitionAudio.play().catch(function () {});
        } catch (e) {}
      }

      // Home button -> pop.mp3, then navigate
      const homeBtn = document.querySelector(".home-btn");
      if (homeBtn) {
        homeBtn.addEventListener("click", function (e) {
          e.preventDefault();

          const destination = homeBtn.getAttribute("href");

          playPopSound();

          setTimeout(function () {
            window.location.href = destination;
          }, 300);
        });
      }

      // Page links -> topic.mp3, then navigate
      const pageLinks = document.querySelectorAll(".pages .page");
      pageLinks.forEach(function (link) {
        link.addEventListener("click", function (e) {
          e.preventDefault();

          const destination = link.getAttribute("href");

          playTopicSound();

          setTimeout(function () {
            window.location.href = destination;
          }, 300);
        });
      });

      // ---- Video popup ----
      const videoBtnWrap = document.querySelector(".video-btn");
      const startVideoBtn = document.querySelector(".start-video-btn");
      const videoPopup = document.querySelector(".video-popup");
      const videoBox = document.querySelector(".video-box");
      const closeVideoBtn = document.querySelector(".close-video-btn");
      const popupVideo = document.querySelector(".popup-video");
      const popupVideoFrame = document.querySelector(".popup-video-frame");

      const centerPlayBtn = document.querySelector(".video-center-play");
      const playPauseBtn = document.querySelector(".play-pause-btn");
      const playPauseIcon = playPauseBtn.querySelector("i");
      const centerPlayIcon = centerPlayBtn.querySelector("i");

      const videoProgress = document.querySelector(".video-progress");
      const currentTimeText = document.querySelector(".current-time");
      const totalTimeText = document.querySelector(".total-time");

      const muteBtn = document.querySelector(".mute-btn");
      const muteIcon = muteBtn.querySelector("i");
      const volumeRange = document.querySelector(".volume-range");

      const fullscreenBtn = document.querySelector(".fullscreen-btn");
      const fullscreenIcon = fullscreenBtn.querySelector("i");

      let controlsTimer;
      let lastVolume = 1;
      let savedVideoTime = 0;
      let isProgressDragging = false;

      function formatTime(time) {
        if (!time || isNaN(time)) return "0:00";

        const minutes = Math.floor(time / 60);
        const seconds = Math.floor(time % 60);

        return `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
      }

      function updatePlayIcons() {
        if (popupVideo.paused) {
          playPauseIcon.className = "fa-solid fa-play";
          centerPlayIcon.className = "fa-solid fa-play";
          centerPlayBtn.classList.remove("hide");
        } else {
          playPauseIcon.className = "fa-solid fa-pause";
          centerPlayIcon.className = "fa-solid fa-pause";
          centerPlayBtn.classList.add("hide");
        }
      }

      function updateProgress() {
        if (!popupVideo.duration) return;

        savedVideoTime = popupVideo.currentTime;

        if (!isProgressDragging) {
          const progressValue =
            (popupVideo.currentTime / popupVideo.duration) * 100;

          videoProgress.value = progressValue;
        }

        currentTimeText.textContent = formatTime(popupVideo.currentTime);
        totalTimeText.textContent = formatTime(popupVideo.duration);
      }

      // Free scrubbing: user can drag forward or backward anywhere on the bar
      function handleProgressInput() {
        if (!popupVideo.duration) return;

        isProgressDragging = true;

        const selectedTime =
          (Number(videoProgress.value) / 100) * popupVideo.duration;

        currentTimeText.textContent = formatTime(selectedTime);
      }

      function handleProgressChange() {
        if (!popupVideo.duration) return;

        const selectedTime =
          (Number(videoProgress.value) / 100) * popupVideo.duration;

        popupVideo.currentTime = selectedTime;
        savedVideoTime = selectedTime;

        isProgressDragging = false;
        updateProgress();
      }

      function updateMuteIcon() {
        if (popupVideo.muted || popupVideo.volume === 0) {
          muteIcon.className = "fa-solid fa-volume-xmark";
        } else if (popupVideo.volume < 0.5) {
          muteIcon.className = "fa-solid fa-volume-low";
        } else {
          muteIcon.className = "fa-solid fa-volume-high";
        }
      }

      function togglePlay() {
        if (!popupVideo) return;

        if (popupVideo.paused) {
          popupVideo.play().catch(function () {});
        } else {
          popupVideo.pause();
        }
      }

      function openVideoPopup() {
        if (!videoPopup || !popupVideo) return;

        document.body.classList.add("video-open");
        videoPopup.classList.add("active");

        popupVideo.volume = Number(volumeRange.value);
        popupVideo.muted = false;

        if (savedVideoTime > 0) {
          popupVideo.currentTime = savedVideoTime;
        }

        updateMuteIcon();
        updatePlayIcons();
        updateProgress();

        setTimeout(function () {
          popupVideo.play().catch(function () {});
        }, 250);
      }

      function closeVideoPopup() {
        if (!videoPopup || !popupVideo) return;

        savedVideoTime = popupVideo.currentTime;

        popupVideo.pause();

        videoPopup.classList.remove("active");
        document.body.classList.remove("video-open");

        if (document.fullscreenElement) {
          document.exitFullscreen().catch(function () {});
        }

        updatePlayIcons();
      }

      function toggleMute() {
        if (popupVideo.muted || popupVideo.volume === 0) {
          popupVideo.muted = false;
          popupVideo.volume = lastVolume || 1;
          volumeRange.value = popupVideo.volume;
        } else {
          lastVolume = popupVideo.volume;
          popupVideo.muted = true;
          volumeRange.value = 0;
        }

        updateMuteIcon();
      }

      function changeVolume() {
        const volumeValue = Number(volumeRange.value);

        popupVideo.volume = volumeValue;
        popupVideo.muted = volumeValue === 0;

        if (volumeValue > 0) {
          lastVolume = volumeValue;
        }

        updateMuteIcon();
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          videoBox.requestFullscreen().catch(function () {});
        } else {
          document.exitFullscreen().catch(function () {});
        }
      }

      function updateFullscreenIcon() {
        if (document.fullscreenElement) {
          fullscreenIcon.className = "fa-solid fa-compress";
        } else {
          fullscreenIcon.className = "fa-solid fa-expand";
        }
      }

      function showControlsTemporarily() {
        popupVideoFrame.classList.remove("controls-hidden");

        clearTimeout(controlsTimer);

        if (!popupVideo.paused) {
          controlsTimer = setTimeout(function () {
            popupVideoFrame.classList.add("controls-hidden");
          }, 2200);
        }
      }

      if (startVideoBtn) {
        startVideoBtn.addEventListener("click", function () {
          playTransitionSound();
          openVideoPopup();
        });
      }

      if (closeVideoBtn) {
        closeVideoBtn.addEventListener("click", closeVideoPopup);
      }

      if (videoPopup) {
        videoPopup.addEventListener("click", function (e) {
          if (e.target === videoPopup) {
            closeVideoPopup();
          }
        });
      }

      if (popupVideo) {
        popupVideo.addEventListener("click", togglePlay);
        popupVideo.addEventListener("play", updatePlayIcons);
        popupVideo.addEventListener("pause", updatePlayIcons);
        popupVideo.addEventListener("timeupdate", updateProgress);
        popupVideo.addEventListener("loadedmetadata", updateProgress);

        popupVideo.addEventListener("ended", function () {
          savedVideoTime = 0;
          videoProgress.value = 0;
          currentTimeText.textContent = "0:00";
          updatePlayIcons();
        });

        popupVideo.addEventListener("contextmenu", function (e) {
          e.preventDefault();
        });
      }

      if (videoProgress) {
        videoProgress.addEventListener("input", handleProgressInput);
        videoProgress.addEventListener("change", handleProgressChange);

        videoProgress.addEventListener("mousedown", function () {
          isProgressDragging = true;
        });

        videoProgress.addEventListener("mouseup", handleProgressChange);

        videoProgress.addEventListener("touchstart", function () {
          isProgressDragging = true;
        });

        videoProgress.addEventListener("touchend", handleProgressChange);
      }

      if (centerPlayBtn) {
        centerPlayBtn.addEventListener("click", togglePlay);
      }

      if (playPauseBtn) {
        playPauseBtn.addEventListener("click", togglePlay);
      }

      if (muteBtn) {
        muteBtn.addEventListener("click", toggleMute);
      }

      if (volumeRange) {
        volumeRange.addEventListener("input", changeVolume);
      }

      if (fullscreenBtn) {
        fullscreenBtn.addEventListener("click", toggleFullscreen);
      }

      if (popupVideoFrame) {
        popupVideoFrame.addEventListener("mousemove", showControlsTemporarily);
        popupVideoFrame.addEventListener("click", showControlsTemporarily);
      }

      document.addEventListener("fullscreenchange", updateFullscreenIcon);

      document.addEventListener("keydown", function (e) {
        if (!videoPopup.classList.contains("active")) return;
        if (!e.key) return;

        if (e.key === "Escape") {
          closeVideoPopup();
        }

        if (e.code === "Space") {
          e.preventDefault();
          togglePlay();
        }

        if (e.key.toLowerCase() === "m") {
          toggleMute();
        }

        if (e.key.toLowerCase() === "f") {
          toggleFullscreen();
        }
      });

      // Show the watch button only on the first slide
      function updateVideoBtnVisibility(activeIndex) {
        if (!videoBtnWrap) return;

        if (activeIndex === 0) {
          videoBtnWrap.classList.add("show");
        } else {
          videoBtnWrap.classList.remove("show");

          if (videoPopup.classList.contains("active")) {
            closeVideoPopup();
          }
        }
      }

      function initSwipers() {
        const prevBtn = document.querySelector(".swiper-ctrl-prev");
        const nextBtn = document.querySelector(".swiper-ctrl-next");
        const pranamLink = document.querySelector(".pranam-link");

        // Swipe sound on prev button click
        if (prevBtn) {
          prevBtn.addEventListener("click", playSwipeSound);
        }

        const videoSwiper = new Swiper(".video-swiper", {
          slidesPerView: 1,
          effect: "fade",
          fadeEffect: {
            crossFade: true,
          },
          speed: 800,
          allowTouchMove: false,
        });

        const contentSwiper = new Swiper(".content-swiper", {
          slidesPerView: 1,
          effect: "fade",
          fadeEffect: {
            crossFade: true,
          },
          speed: 800,
          allowTouchMove: false,
          navigation: {
            prevEl: ".swiper-ctrl-prev",
          },
          on: {
            init: function () {
              playActiveVideo(this.activeIndex);
              updateNavButtons(this);
            },
            slideChange: function () {
              videoSwiper.slideTo(this.activeIndex);
              playActiveVideo(this.activeIndex);
              updateNavButtons(this);
            },
          },
        });

        function playActiveVideo(activeIndex) {
          const videos = document.querySelectorAll(".topic-video");

          videos.forEach((video, index) => {
            video.pause();
            video.currentTime = 0;

            if (index === activeIndex) {
              video.play().catch(() => {});
            }
          });
        }

        function updateNavButtons(swiper) {
          if (swiper.isBeginning) {
            prevBtn.style.display = "none";
          } else {
            prevBtn.style.display = "flex";
          }

          if (swiper.isEnd) {
            nextBtn.style.display = "none";
            pranamLink?.classList.add("show");
          } else {
            nextBtn.style.display = "flex";
            pranamLink?.classList.remove("show");
          }

          updateVideoBtnVisibility(swiper.activeIndex);
        }

        nextBtn.addEventListener("click", function () {
          playSwipeSound();

          if (contentSwiper.isEnd) {
            pageFadeOut("pranam.html");
          } else {
            contentSwiper.slideNext();
          }
        });
      }

      initSwipers();
    </script>
  </body>
</html>
