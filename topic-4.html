<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="title"></title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />

    <style>
      .pranam-link {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
    right: 2vw;
    bottom: 2vw;
    width: 9vw;
    height: auto;
    text-decoration: none;
    z-index: 9999;
    cursor: pointer;
    transform-origin: center;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }

  .pranam-link.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    animation: pranamPop 1.2s ease-in-out infinite;
  }
    
.pranam-link img {
  position: relative;
  width: 100%;
  display: block;
  object-fit: contain;
}

.pranam-link span {
  position: absolute;
  text-decoration: none;
  color: white;
  font-weight: bold;
  font-size: 1.3vw;
  padding-right: 1vw;
    font-family: "BalooRegular";

}

@keyframes pranamPop {
  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.12);
  }

  100% {
    transform: scale(1);
  }
}
    </style>
  </head>

  <body>
    <a class="home-button home-btn" href="index.html">
      <img src="./assets/images/home-btn.png" alt="" />
    </a>

    <div class="page-title">
      <span data-lang-key="title"></span>
    </div>
    <a href="pranam.html" class="pranam-link">
      <img src="./assets/images/arowAsset.png" alt="" />
      <span data-lang-key="pranam"></span>
    </a>
    <div class="language-container">
      <div class="english active">E</div>
      <div class="hindi">H</div>
      <div class="gujrati">G</div>
    </div>

    <main>
      <div class="left-container">
        <div class="video-frame">
          <div class="video-swiper swiper">
            <div class="swiper-wrapper">
              <div class="swiper-slide">
                <video
                  class="topic-video"
                  src="./assets/videos/p4_v1.mp4"
                  muted
                  playsinline
                ></video>
              </div>
              <div class="swiper-slide">
                <video
                  class="topic-video"
                  src="./assets/videos/p4_v2.mp4"
                  muted
                  playsinline
                ></video>
              </div>
              <div class="swiper-slide">
                <video
                  class="topic-video"
                  src="./assets/videos/p4_v3.mp4"
                  muted
                  playsinline
                ></video>
              </div>
              <div class="swiper-slide">
                <video
                  class="topic-video"
                  src="./assets/videos/p4_v4.mp4"
                  muted
                  playsinline
                ></video>
              </div>
              <div class="swiper-slide">
                <video
                  class="topic-video"
                  src="./assets/videos/p4_v5.mp4"
                  muted
                  playsinline
                ></video>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="right-container">
        <div class="pages">
          <a class="page page-1" href="topic-1.html" data-lang-key="num-1"></a>
           <a class="page page-2" href="topic-2.html" data-lang-key="num-2"></a>
          <a class="page page-1" href="topic-3.html" data-lang-key="num-3"></a>
          <a class="page page-1 active" href="topic-4.html" data-lang-key="num-4"></a>
        </div>
        <div class="content-card">
          <div class="content-top-badge">
            <div class="num" data-lang-key="num-4"></div>
            <img src="./assets/images/swiper-topic.png" alt="" />
            <span class="slide-question" data-lang-key="title-4"></span>
          </div>

          <div class="content-swiper swiper">
            <div class="swiper-wrapper">
              <div class="swiper-slide">
                <div class="content-slide-text" data-lang-key="slide-4.1"></div>
              </div>
              <div class="swiper-slide">
                <div class="content-slide-text" data-lang-key="slide-4.2"></div>
              </div>
              <div class="swiper-slide">
                <div class="content-slide-text" data-lang-key="slide-4.3"></div>
              </div>
              <div class="swiper-slide">
                <div class="content-slide-text" data-lang-key="slide-4.4"></div>
              </div>
              <div class="swiper-slide">
                <div class="content-slide-text" data-lang-key="slide-4.5"></div>
              </div>
            </div>
          </div>

          <button class="swiper-nav swiper-ctrl-prev" aria-label="Previous">
            <img src="./assets/images/prev-btn.png" alt="Previous" />
          </button>

          <button class="swiper-nav swiper-ctrl-next" aria-label="Next">
            <img src="./assets/images/next-btn.png" alt="Next" />
          </button>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="./assets/js/app.js"></script>
    <script>
      // ---- Audio SFX setup ----
      const popAudio = new Audio("./assets/audio/pop.mp3");
      const swipeAudio = new Audio("./assets/audio/swipe.mp3");
      const topicAudio = new Audio("./assets/audio/topic.mp3");
      popAudio.preload = "auto";
      swipeAudio.preload = "auto";
      topicAudio.preload = "auto";

      function playPopSound() {
        try {
          popAudio.currentTime = 0;
          popAudio.play().catch(function () {});
        } catch (e) {}
      }

      function playSwipeSound() {
        try {
          swipeAudio.currentTime = 0;
          swipeAudio.play().catch(function () {});
        } catch (e) {}
      }

      function playTopicSound() {
        try {
          topicAudio.currentTime = 0;
          topicAudio.play().catch(function () {});
        } catch (e) {}
      }

      // Home button -> pop.mp3, then navigate
      const homeBtn = document.querySelector(".home-btn");
      if (homeBtn) {
        homeBtn.addEventListener("click", function (e) {
          e.preventDefault();

          const destination = homeBtn.getAttribute("href");

          playPopSound();

          setTimeout(function () {
            window.location.href = destination;
          }, 300);
        });
      }

      // Page links -> topic.mp3, then navigate
      const pageLinks = document.querySelectorAll(".pages .page");
      pageLinks.forEach(function (link) {
        link.addEventListener("click", function (e) {
          e.preventDefault();

          const destination = link.getAttribute("href");

          playTopicSound();

          setTimeout(function () {
            window.location.href = destination;
          }, 300);
        });
      });

      function initSwipers() {
        const prevBtn = document.querySelector(".swiper-ctrl-prev");
        const nextBtn = document.querySelector(".swiper-ctrl-next");
        const pranamLink = document.querySelector(".pranam-link");

        // Swipe sound on prev button click
        if (prevBtn) {
          prevBtn.addEventListener("click", playSwipeSound);
        }

        const videoSwiper = new Swiper(".video-swiper", {
          slidesPerView: 1,
          effect: "fade",
          fadeEffect: {
            crossFade: true,
          },
          speed: 800,
          allowTouchMove: false,
        });

        const contentSwiper = new Swiper(".content-swiper", {
          slidesPerView: 1,
          effect: "fade",
          fadeEffect: {
            crossFade: true,
          },
          speed: 800,
          allowTouchMove: false,
          navigation: {
            prevEl: ".swiper-ctrl-prev",
          },
          on: {
            init: function () {
              playActiveVideo(this.activeIndex);
              updateNavButtons(this);
            },
            slideChange: function () {
              videoSwiper.slideTo(this.activeIndex);
              playActiveVideo(this.activeIndex);
              updateNavButtons(this);
            },
          },
        });

        function playActiveVideo(activeIndex) {
          const videos = document.querySelectorAll(".topic-video");

          videos.forEach((video, index) => {
            video.pause();
            video.currentTime = 0;

            if (index === activeIndex) {
              video.play().catch(() => {});
            }
          });
        }

        function updateNavButtons(swiper) {
          if (swiper.isBeginning) {
            prevBtn.style.display = "none";
          } else {
            prevBtn.style.display = "flex";
          }

          if (swiper.isEnd) {
            nextBtn.style.display = "none";
            pranamLink?.classList.add("show");
          } else {
            nextBtn.style.display = "flex";
            pranamLink?.classList.remove("show");
          }
        }

        nextBtn.addEventListener("click", function () {
          playSwipeSound();

          if (contentSwiper.isEnd) {
            pageFadeOut("pranam.html");
          } else {
            contentSwiper.slideNext();
          }
        });
      }

      initSwipers();
    </script>
  </body>
</html>
